apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptforge
  namespace: promptforge
  labels: { app: promptforge }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: promptforge }
  template:
    metadata:
      labels: { app: promptforge }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - { name: ghcr-pull }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: promptforge
          # Pinned by .github/workflows/oke-image.yml (placeholder until the first run).
          image: ghcr.io/azrtydxb/promptforge-oke@sha256:512d4af0f20c46b7619be4cfad345762e838b06e0bed9d649aa16edaba1a298d
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: promptforge-pg-shared, key: uri }
          envFrom:
            - secretRef: { name: promptforge-env }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 224Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: promptforge
  namespace: promptforge
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: promptforge }
