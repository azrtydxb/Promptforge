apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptforge
  namespace: promptforge
  labels: { app: promptforge }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: promptforge }
  template:
    metadata:
      labels: { app: promptforge }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - { name: ocir-pull }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: promptforge
          # OCIR, linux/arm64. Pinned by .github/workflows/oke-image.yml.
          image: dxb.ocir.io/axmcgpqk0w0z/azrty/promptforge@sha256:891a77ef0951903c29ff4a4a6430d8e628985405d9a624b656738c0eda179918
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: promptforge-pg-shared, key: uri }
          envFrom:
            - secretRef: { name: promptforge-env }
            # OIDC client at login.azrty.com (ZITADEL_ISSUER, _CLIENT_ID, _CLIENT_SECRET),
            # written by the zitadel-config runner in azrty-infra.
            - secretRef: { name: promptforge-oidc }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 224Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: promptforge
  namespace: promptforge
spec:
  maxUnavailable: 1 # single replica: minAvailable 1 would block node drains
  selector:
    matchLabels: { app: promptforge }
