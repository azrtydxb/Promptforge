# Served on the shared OKE gateway ("edge" in envoy-gateway-system). The listener
# and its certificate for promptforge.azrty.com are owned by azrty-infra
# (platform/gateway/gateway.yaml) — see deploy/oke/azrty-infra/README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: promptforge
  namespace: promptforge
spec:
  parentRefs:
    - { name: edge, namespace: envoy-gateway-system, sectionName: promptforge-azrty-com }
  hostnames: [promptforge.azrty.com]
  rules:
    - backendRefs:
        - { name: promptforge, port: 80 }
