name: OKE image

# Builds the Promptforge image for linux/amd64 + linux/arm64 (OKE nodes are ARM64),
# pushes it to GHCR and pins the new digest in deploy/kuvryn-sync/oke/deployment.yaml
# in a follow-up commit. Kuvryn Sync on the OKE cluster deploys that commit.
# (Pushes made with GITHUB_TOKEN do not trigger workflows, so the pin commit does
# not loop.) Independent of deploy.yml, which keeps deploying ECS.
on:
  push:
    branches: [main]
    paths-ignore: ["deploy/kuvryn-sync/**", "deploy/oke/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)

concurrency:
  group: oke-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/azrtydxb/promptforge-oke
  MANIFEST: deploy/kuvryn-sync/oke/deployment.yaml

jobs:
  image:
    runs-on: arc-azrtydxb
    # arm64-native build (OKE nodes are ARM64); a QEMU emulated leg breaks
    # Prisma's WASM schema validation under Node 26.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The runner pod's rootless BuildKit sidecar (native arm64); it pushes with
      # the docker CLI's credentials, so both logins below must run in this job.
      - id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main
      - id: ant
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: oke
          # The arch of the image, not of the runner the job happens to run on.
          arch-suffix: arm64
          docker-login: "true"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: ${{ steps.ant.outputs.cache-from }}
          cache-to: ${{ steps.ant.outputs.cache-to }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Pin digest in the deploy manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          # main's ruleset lets a deploy key bypass the required checks, which the
          # GitHub Actions token cannot be granted (it was refused with GH006). SSH
          # over 443 keeps the push working from the runner's restricted egress.
          DEPLOY_KEY: ${{ secrets.PROMPTFORGE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host github.com\n  HostName ssh.github.com\n  Port 443\n  User git\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuilt from origin on every attempt: a concurrent push only moves main.
          for attempt in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --hard --quiet "origin/${GITHUB_REF_NAME}"
            sed -i -E "s|(image: ${IMAGE})[@:][^[:space:]]*|\1@${DIGEST}|" "$MANIFEST"
            if git diff --quiet; then echo "manifest already pinned"; exit 0; fi
            git commit -qam "deploy: promptforge ${DIGEST:7:12} [skip ci]"
            if git push --quiet "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"; then
              echo "pinned ${DIGEST} on ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "push rejected, rebuilding from origin (attempt $attempt)"
            sleep 5
          done
          echo "could not pin the digest" >&2
          exit 1
