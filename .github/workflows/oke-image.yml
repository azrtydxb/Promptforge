name: OKE image

# Builds the Promptforge image for linux/amd64 + linux/arm64 (OKE nodes are ARM64),
# pushes it to GHCR and pins the new digest in deploy/kuvryn-sync/oke/deployment.yaml
# in a follow-up commit. Kuvryn Sync on the OKE cluster deploys that commit.
# (Pushes made with GITHUB_TOKEN do not trigger workflows, so the pin commit does
# not loop.) Independent of deploy.yml, which keeps deploying ECS.
on:
  push:
    branches: [main]
    paths-ignore: ["deploy/kuvryn-sync/**", "deploy/oke/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: oke-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/azrtydxb/promptforge
  MANIFEST: deploy/kuvryn-sync/oke/deployment.yaml

jobs:
  image:
    runs-on: ubuntu-latest
    # arm64 is built under QEMU emulation (pnpm install + next build).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=oke-image
          cache-to: type=gha,mode=max,scope=oke-image
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Pin digest in the deploy manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sed -i -E "s|(image: ${IMAGE})[@:][^[:space:]]*|\1@${DIGEST}|" "$MANIFEST"
          if git diff --quiet; then echo "manifest already pinned"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: promptforge ${DIGEST:7:12}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
